// Top-level build file where you can add configuration options common to all sub-projects/modules.

// ── 国内镜像加速 ────────────────────────────────────────
// 说明：优先走国内镜像，失败自动回退官方源。
// 镜像为只读缓存，产物与官方源一致（含校验）。
buildscript {
    ext {
        aliyunGoogle = 'https://maven.aliyun.com/repository/google'
        aliyunCentral = 'https://maven.aliyun.com/repository/central'
        aliyunGradlePlugin = 'https://maven.aliyun.com/repository/gradle-plugin'
        aliyunPublic = 'https://maven.aliyun.com/repository/public'
        tencentGoogle = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
    }

    repositories {
        maven { url aliyunGoogle }
        maven { url aliyunCentral }
        maven { url aliyunGradlePlugin }
        maven { url aliyunPublic }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url aliyunGoogle }
        maven { url aliyunCentral }
        maven { url aliyunPublic }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
